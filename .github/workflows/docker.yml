name: Docker

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      push:
        description: Push image to GHCR
        type: boolean
        default: true

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-24.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load CI config
        run: sh ci/scripts/load-ci-env.sh

      - name: Image name
        id: image
        run: |
          set -eu
          OWNER=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          NAME=$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${OWNER}/${NAME}" >>"${GITHUB_OUTPUT}"

      - name: Decide push
        id: push
        run: |
          set -eu
          PUSH=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.push }}" = "true" ]; then
              PUSH=true
            fi
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            PUSH=true
          fi
          echo "push=${PUSH}" >>"${GITHUB_OUTPUT}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: steps.push.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ steps.push.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEBIAN_IMAGE=${{ env.DEBIAN_IMAGE }}
            GOLANG_IMAGE=${{ env.GOLANG_DEBIAN_IMAGE }}
            ODIN_VERSION=${{ env.ODIN_VERSION }}
            ODIN_LINUX_AMD64_SHA256=${{ env.ODIN_LINUX_AMD64_SHA256 }}
            RNS_REF=${{ env.RNS_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
